<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventario</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inventario">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#5B7F4A">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FAFAF8;
    }
    #cargando {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #8A8A8A;
      background: #FAFAF8;
    }
    #cargando img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(46,42,38,0.18);
    }
    #cargando span { font-size: 14px; }
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #e3e3e0;
      border-top-color: #5B7F4A;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    noscript { display: block; padding: 24px; font-family: sans-serif; text-align: center; }
  </style>
</head>
<body>

  <div id="cargando">
    <img src="icon-192.png" alt="">
    <div class="spinner"></div>
    <span>Abriendo Inventario…</span>
  </div>

  <noscript>
    <p>Activa JavaScript, o entra directo a
      <a href="https://script.google.com/macros/s/AKfycbwf7ptkeOG2zGGYGfjymuIbxWmyXqoQXXaoqMhSMVIaCxgYAfFPYcxUXb-mXD1mo08TFA/exec">la app de inventario</a>.
    </p>
  </noscript>

  <script>
    // Si la app ya esta instalada (se abrio desde el icono en la
    // pantalla de inicio), salta casi de inmediato. Si se abre desde
    // el navegador normal (primera vez, para poder agregarla a la
    // pantalla de inicio con el icono correcto), espera unos segundos
    // antes de saltar, para dar tiempo a usar "Agregar a pantalla de
    // inicio" mientras se ve esta pantalla.
    var instalada = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    var espera = instalada ? 50 : 6000;

    setTimeout(function () {
      location.replace(
        'https://script.google.com/macros/s/AKfycbwf7ptkeOG2zGGYGfjymuIbxWmyXqoQXXaoqMhSMVIaCxgYAfFPYcxUXb-mXD1mo08TFA/exec'
      );
    }, espera);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
