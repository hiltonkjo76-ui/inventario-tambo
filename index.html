<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventario</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inventario">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#5B7F4A">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FAFAF8;
      overflow: hidden;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #cargando {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #8A8A8A;
      background: #FAFAF8;
    }
    #cargando img { width: 56px; height: 56px; border-radius: 14px; }
  </style>
</head>
<body>

  <div id="cargando">
    <img src="icon-192.png" alt="">
    <span>Cargando Inventario…</span>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbwf7ptkeOG2zGGYGfjymuIbxWmyXqoQXXaoqMhSMVIaCxgYAfFPYcxUXb-mXD1mo08TFA/exec"
    title="Inventario"
    onload="document.getElementById('cargando').style.display='none'">
  </iframe>

</body>
</html>
